name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  prettier-and-lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: arduino/setup-task@v2
      - name: Install dependencies
        run: npm ci
      - name: Check formatting and lint
        run: task check

  api-tests:
    needs: prettier-and-lint
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Chronos_Playwright_testing
        uses: actions/checkout@v4

      - name: Checkout Chronost_App (backend)
        uses: actions/checkout@v4
        with:
          repository: jirivondra/Chronost_App
          path: chronost-app

      - name: Checkout mocha_api_soap_testing
        uses: actions/checkout@v4
        with:
          repository: jirivondra/mocha_api_soap_testing
          path: mocha-api-tests

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://npm.pkg.github.com
          scope: '@jirivondra'

      - uses: arduino/setup-task@v2

      - name: Start backend
        run: task start-backend CHRONOST_APP_DIR=chronost-app

      - name: Install dependencies and run Mocha REST regression suite
        working-directory: mocha-api-tests
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
          BASE_URL: http://localhost:8000
          API_USERNAME: admin
          API_PASSWORD: secret
        run: |
          npm ci
          npm run test:regression

  e2e-flow:
    needs: api-tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:8000
      API_USERNAME: admin
      API_PASSWORD: secret
    steps:
      - name: Checkout Chronos_Playwright_testing
        uses: actions/checkout@v4

      - name: Checkout Chronost_App
        uses: actions/checkout@v4
        with:
          repository: jirivondra/Chronost_App
          path: chronost-app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: arduino/setup-task@v2

      - name: Start app
        run: task start-app CHRONOST_APP_DIR=chronost-app

      - name: Install dependencies and browsers
        run: |
          npm ci
          npx playwright install --with-deps
          npx playwright install chrome

      - name: Run e2e flow suite
        run: npx playwright test tests/e2e-flow

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
