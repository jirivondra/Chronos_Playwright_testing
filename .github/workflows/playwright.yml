name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  prettier-and-lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Check formatting (Prettier)
        run: npm run format-check
      - name: Check lint (ESLint)
        run: npm run lint

  api-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Chronos_Playwright_testing
        uses: actions/checkout@v4

      - name: Checkout Chronost_App (backend)
        uses: actions/checkout@v4
        with:
          repository: jirivondra/Chronost_App
          path: chronost-app

      - name: Checkout mocha_api_soap_testing
        uses: actions/checkout@v4
        with:
          repository: jirivondra/mocha_api_soap_testing
          path: mocha-api-tests

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://npm.pkg.github.com
          scope: '@jirivondra'

      - name: Start backend, install dependencies, run Mocha REST regression suite
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
          BASE_URL: http://localhost:8000
          API_USERNAME: admin
          API_PASSWORD: secret
        run: |
          pip install -r chronost-app/api/requirements.txt
          (cd chronost-app && nohup python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 &)
          timeout 30 bash -c 'until curl -sf -u admin:secret http://localhost:8000/todos > /dev/null; do sleep 1; done'
          cd mocha-api-tests
          npm ci
          npm run test:regression

  regression:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:8000
      API_USERNAME: admin
      API_PASSWORD: secret
    steps:
      - name: Checkout Chronos_Playwright_testing
        uses: actions/checkout@v4

      - name: Checkout Chronost_App
        uses: actions/checkout@v4
        with:
          repository: jirivondra/Chronost_App
          path: chronost-app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Start app, install dependencies, run functional suite
        run: |
          pip install -r chronost-app/api/requirements.txt
          (cd chronost-app && nohup python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 &)
          (cd chronost-app && nohup python3 -m http.server 3000 --directory frontend &)
          timeout 30 bash -c 'until curl -sf -u admin:secret http://localhost:8000/todos > /dev/null; do sleep 1; done'
          timeout 30 bash -c 'until curl -sf http://localhost:3000/login.html > /dev/null; do sleep 1; done'
          npm ci
          npx playwright install --with-deps
          npx playwright install chrome
          npx playwright test --grep-invert "Visual Tests"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
