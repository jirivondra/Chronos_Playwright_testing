# Regenerates visual regression baselines on a real Linux GitHub Actions
# runner (no local Docker/emulation needed) and opens a PR with the result.
#
# Requires, once, in this repo's Settings -> Actions -> General:
#   Workflow permissions: "Read and write permissions"
#   + "Allow GitHub Actions to create and approve pull requests"
name: Update Playwright Snapshots

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-snapshots:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:8000
      API_USERNAME: admin
      API_PASSWORD: secret
    steps:
      - name: Checkout Chronos_Playwright_testing
        uses: actions/checkout@v4

      - name: Checkout Chronost_App
        uses: actions/checkout@v4
        with:
          repository: jirivondra/Chronost_App
          path: chronost-app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Start app, install dependencies and browsers
        run: |
          pip install -r chronost-app/api/requirements.txt
          (cd chronost-app && nohup python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 &)
          (cd chronost-app && nohup python3 -m http.server 3000 --directory frontend &)
          timeout 30 bash -c 'until curl -sf -u admin:secret http://localhost:8000/todos > /dev/null; do sleep 1; done'
          timeout 30 bash -c 'until curl -sf http://localhost:3000/login.html > /dev/null; do sleep 1; done'
          npm ci
          npx playwright install --with-deps
          npx playwright install chrome

      - name: Update visual snapshots
        run: npx playwright test --grep "Visual Tests" --update-snapshots

      - name: Check for snapshot changes
        id: changes
        run: |
          git add tests/regression/*.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No snapshot changes detected"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git status --porcelain
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update visual regression snapshots'
          title: 'Update Playwright visual snapshots'
          body: |
            Baseline PNGs regenerated on a Linux GitHub Actions runner via `--update-snapshots`.
            Review the diffs before merging — this workflow accepts whatever rendered, it doesn't judge correctness.
          branch: update-snapshots-${{ github.run_number }}
          delete-branch: true
          add-paths: tests/regression/*.spec.ts-snapshots

      - name: No changes found
        if: steps.changes.outputs.has_changes == 'false'
        run: echo "No snapshot changes were needed — visual baselines are already up to date."

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
