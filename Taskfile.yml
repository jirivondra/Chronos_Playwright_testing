version: '3'

tasks:
  # --- Tests ---
  run-test:
    desc: Run all tests
    cmd: npm run test

  test-headed:
    desc: Run tests with browser open
    cmd: npm run test_headed

  test-ui:
    desc: Open Playwright UI for interactive debugging
    cmd: npm run test_ui

  test-report:
    desc: Show HTML report from last run
    cmd: npm run test_report

  report:
    desc: Run all tests and open HTML report
    cmds:
      - task: run-test
      - task: test-report

  update-snapshots:
    desc: 'Regenerate visual snapshots via Docker (Linux-consistent, matches CI). Requires Docker running and the app up on localhost:3000/8000. Usage: task update-snapshots -- tests/regression/login_page.spec.ts'
    cmd: >-
      docker run --rm --platform linux/amd64
      --add-host=host.docker.internal:host-gateway
      -v "$PWD":/work -v pw_node_modules:/work/node_modules -w /work
      -e BASE_URL=http://host.docker.internal:3000
      -e API_BASE_URL=http://host.docker.internal:8000
      mcr.microsoft.com/playwright:v1.59.1-noble
      bash -c "npm ci --silent && npx playwright install chrome && npx playwright test {{.CLI_ARGS}} --update-snapshots"

  # --- Code quality ---
  lint:
    desc: Check code with ESLint
    cmd: npm run lint

  lint-fix:
    desc: Auto-fix lint issues with ESLint
    cmd: npm run lint-fix

  format-check:
    desc: Check code formatting with Prettier
    cmd: npm run format-check

  format-fix:
    desc: Auto-fix formatting with Prettier
    cmd: npm run format

  check:
    desc: Run all code quality checks (ESLint + Prettier)
    cmds:
      - task: lint
      - task: format-check

  fix:
    desc: Auto-fix formatting and lint issues (Prettier + ESLint)
    cmds:
      - npm run format
      - npm run lint-fix
